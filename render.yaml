# Code by Xipzer
# Render Blueprint. Defines the Kybera static SPA and the CORS proxy Web Service.
#
# The static site can't run functions, so the LLM/OAuth/Polymarket calls the SPA
# makes under /api/* are rewritten to the proxy Web Service (see the routes on
# the static site below and proxy/index.ts).

services:
  # --- CORS proxy (LLM providers + OAuth token endpoints + Polymarket) ---
  # Zero-dependency Node service — no build step needed.
  - type: web
    name: kybera-proxy
    runtime: node
    rootDir: proxy
    plan: free
    buildCommand: ''
    startCommand: node index.js
    healthCheckPath: /health

  # --- Static SPA ---
  - type: web
    name: kybera-app
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Proxy all /api/* to the proxy service (replace the URL after first deploy).
      - type: rewrite
        source: /api/*
        destination: https://kybera-proxy.onrender.com/api/*
      # SPA fallback for client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
