# Code by Xipzer
# Cloudflare Worker that proxies the LLM providers + OAuth token endpoints so the
# static SPA at app.kybera.xyz can reach them without cross-origin CORS blocks.
#
# Deploy:  cd workers && npx wrangler deploy
# Then route app.kybera.xyz/api/* to this worker (Cloudflare dashboard > Workers Routes),
# or set the app's /api/* host rewrites to the worker URL.

name = "kybera-llm-proxy"
main = "llm-proxy.js"
compatibility_date = "2025-01-01"

# Example route binding (adjust to your zone):
# [[routes]]
# pattern = "app.kybera.xyz/api/*"
# zone_name = "kybera.xyz"
