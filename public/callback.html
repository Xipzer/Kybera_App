<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Kybera — Sign-in Callback</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a12;
        color: #e6e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: min(92vw, 440px);
        padding: 32px;
        border-radius: 20px;
        background: #12121f;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #9498b8; margin: 0 0 20px; line-height: 1.5; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        word-break: break-all;
        padding: 12px;
        border-radius: 12px;
        background: #0a0a12;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 16px;
        display: none;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #8b8bff, #6464ff);
      }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #8b8bff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Completing sign-in…</h1>
      <p id="desc">You can return to Kybera. This window should close automatically.</p>
      <div class="code" id="code"></div>
      <button id="copyBtn" style="display: none">Copy code</button>
    </div>
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var code = params.get('code')
        var state = params.get('state') || ''
        var error = params.get('error')
        var title = document.getElementById('title')
        var desc = document.getElementById('desc')
        var spinner = document.getElementById('spinner')
        var codeEl = document.getElementById('code')
        var copyBtn = document.getElementById('copyBtn')

        function finishManual(value, message) {
          spinner.style.display = 'none'
          title.textContent = message
          desc.textContent =
            'Copy the code below and paste it into Kybera to finish signing in.'
          codeEl.textContent = value
          codeEl.style.display = 'block'
          copyBtn.style.display = 'inline-block'
          copyBtn.onclick = function () {
            navigator.clipboard.writeText(value).then(function () {
              copyBtn.textContent = 'Copied!'
            })
          }
        }

        if (error) {
          spinner.style.display = 'none'
          title.textContent = 'Sign-in failed'
          desc.textContent = error
          return
        }

        if (!code) {
          spinner.style.display = 'none'
          title.textContent = 'Missing authorization code'
          desc.textContent = 'No code was returned by the provider.'
          return
        }

        var payload = { source: 'kybera-oauth', code: code, state: state }

        // Popup mode: relay to the opener, then close.
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(payload, window.location.origin)
            title.textContent = 'Signed in'
            desc.textContent = 'You can close this window.'
            spinner.style.display = 'none'
            setTimeout(function () {
              window.close()
            }, 400)
            return
          } catch (e) {
            /* fall through to manual */
          }
        }

        // Redirect (non-popup) mode: stash for the app to read on return.
        try {
          localStorage.setItem('kybera-oauth-callback', JSON.stringify(payload))
        } catch (e) {
          /* ignore */
        }

        finishManual(state ? code + '#' + state : code, 'Almost done')
      })()
    </script>
  </body>
</html>
